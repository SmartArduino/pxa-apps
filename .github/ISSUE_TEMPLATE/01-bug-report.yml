name: 缺陷反馈 / Bug report
description: 报告可复现的错误、崩溃或异常行为 / Report a bug, crash or unexpected behavior.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |-
        本仓库受理 / This repository covers: PXA 应用、游戏、商城客户端与 common 共享应用代码 / PXA apps, games, store client and shared application code。

        - [pxa-workspace](https://github.com/SmartArduino/pxa-workspace/issues/new/choose): ESP 固件、板级驱动、烧录、工作区脚本与显示配置 / ESP firmware, board drivers, flashing, workspace scripts and display profiles。
        - [pxa-system](https://github.com/SmartArduino/pxa-system/issues/new/choose): 系统运行库、服务、UI、SDK、DevKit、Agent Kit、打包工具与模拟器实现 / System runtime, services, UI, SDK, DevKit, Agent Kit, packaging tools and simulator implementation。

        不确定归属时，可按观察到的问题提交，并关联其他仓库中的相关 Issue；同一问题请勿重复提交。 / If unsure, report what you observed and link related issues; avoid duplicate reports.
        可使用中文或英文填写。 / Chinese or English is welcome.
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查 / Before submitting
      options:
        - label: 我已搜索[现有 Issue](https://github.com/SmartArduino/pxa-apps/issues?q=is%3Aissue)，未找到相同反馈。 / I searched existing
            issues and found no duplicate.
          required: true
  - type: input
    id: app
    attributes:
      label: 应用或共享模块 / App or shared module
      description: 填写应用 ID、目录名或 common 模块；跨应用问题可列出多个，不确定可写 unknown。 / Enter app IDs, directories or a common module;
        list multiple if needed, or use unknown if unsure.
      placeholder: 例如 / e.g. store, pixel-dungeon, common/cpp
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 涉及模块 / Component
      options:
        - 应用功能或游戏玩法 / App behavior or gameplay
        - 界面、输入与适配 / UI, input and display adaptation
        - 性能、音频与资源 / Performance, audio and resources
        - 存档、数据与设置 / Saves, data and settings
        - 商城客户端 / Store client
        - 应用构建与 common 共享代码 / App builds and shared common code
        - 不确定或其他 / Unsure or other
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: 版本信息 / Versions
      description: 优先填写已安装应用的版本与安装来源；源码构建时补充 pxa-apps 提交和 SDK 版本。不知道的项目可写 unknown。 / Include the installed app version and
        source; add the apps commit and SDK version for source builds; use unknown if unavailable.
      placeholder: |-
        Installed app version / package filename:
        Install source (store / release URL / local build):
        pxa-apps commit (source builds only):
        DevKit / SDK version or pxa.lock release (source builds only):
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境 / Environment
      description: 提供设备固件或模拟器版本、板型与屏幕 Profile；按问题补充输入方式、存储或网络。不适用的项目可写 N/A。 / Include firmware or simulator version, board
        and display profile, with input, storage or network details when relevant; use N/A where appropriate.
      placeholder: |-
        Device or simulator / firmware version:
        Board / chip / display size / profile:
        Input method (touch / buttons / controller):
        Storage / network / resource version (if relevant):
        Host OS (simulator or source builds only):
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 实际表现 / Actual behavior
      description: 描述具体错误及影响；一次反馈一个问题。 / Describe the error and its impact; report one problem per issue.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 提供完整命令、配置或最小示例；偶发问题请写明触发条件与频率。 / Include exact commands, configuration or a minimal example; describe triggers
        and frequency for intermittent issues.
      placeholder: |-
        1. 安装并打开指定版本的应用 / Install and open the specified app version
        2. 描述页面、关卡、输入与必要资源 / Describe the screen, level, input and required resources
        3. 观察结果 / Observe the result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期表现 / Expected behavior
      description: 说明在相同步骤下期望发生什么。 / Describe what should happen with the same steps.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / Logs
      description: 粘贴构建、串口、崩溃或模拟器日志，并保留错误前后的上下文；无需手写代码块。提交前移除私钥、令牌和个人信息。 / Paste relevant logs with surrounding context, without
        code fences; remove private keys, tokens and personal data.
      render: text
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 附件与补充信息 / Attachments and context
      description: 可拖入截图、录屏或最小复现文件；如已知，补充正常版本、回归范围、变通方法及相关 Issue 链接。 / Attach screenshots, recordings or a minimal reproducer;
        include known working versions, workarounds and related issues if available.
    validations:
      required: false
