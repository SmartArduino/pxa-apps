name: 中文｜使用咨询
description: 咨询配置、接入或开发方法
title: '[咨询] '
body:
  - type: markdown
    attributes:
      value: |-
        本仓库受理：PXA 应用、游戏、商城客户端与 common 共享应用代码。

        - [pxa-workspace](https://github.com/SmartArduino/pxa-workspace/issues/new?template=04-question.zh-CN.yml)：ESP 固件、板级驱动、烧录、工作区脚本与显示配置。
        - [pxa-system](https://github.com/SmartArduino/pxa-system/issues/new?template=04-question.zh-CN.yml)：系统运行库、服务、UI、SDK、DevKit、Agent Kit、打包工具与模拟器实现。

        不确定归属时，可按观察到的问题提交，并关联其他仓库中的相关 Issue；同一问题请勿重复提交。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索[现有 Issue](https://github.com/SmartArduino/pxa-apps/issues?q=is%3Aissue)，未找到相同反馈。
          required: true
  - type: input
    id: target
    attributes:
      label: 咨询对象
      description: 注明相关模块、命令、板型或应用；不确定时可填写“不清楚”。
      placeholder: 应用 ID、目录名或 common 模块
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 问题与目标
      description: 描述你想完成的操作，以及需要帮助的具体环节。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 版本与环境
      description: 只填写与问题相关的项目；无法确认时可填写“不清楚”。
      placeholder: |-
        应用 ID、目录名与应用版本：
        安装来源（商城、发行版或本地构建）：
        固件、模拟器与 SDK 版本：
        板型、屏幕显示配置与输入方式：
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: 已尝试的步骤
      description: 说明已查阅的文档、执行的命令和结果；日志请移除密钥、令牌和个人信息。
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 附件与参考
      description: 按需补充截图、最小示例或相关 Issue 链接。
    validations:
      required: false
