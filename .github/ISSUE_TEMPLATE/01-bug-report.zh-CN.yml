name: 中文｜缺陷反馈
description: 报告可复现的错误、崩溃或异常行为
title: '[缺陷] '
body:
  - type: markdown
    attributes:
      value: |-
        本仓库受理：PXA 应用、游戏、商城客户端与 common 共享应用代码。

        - [pxa-workspace](https://github.com/SmartArduino/pxa-workspace/issues/new?template=01-bug-report.zh-CN.yml)：ESP 固件、板级驱动、烧录、工作区脚本与显示配置。
        - [pxa-system](https://github.com/SmartArduino/pxa-system/issues/new?template=01-bug-report.zh-CN.yml)：系统运行库、服务、UI、SDK、DevKit、Agent Kit、打包工具与模拟器实现。

        不确定归属时，可按观察到的问题提交，并关联其他仓库中的相关 Issue；同一问题请勿重复提交。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索[现有 Issue](https://github.com/SmartArduino/pxa-apps/issues?q=is%3Aissue)，未找到相同反馈。
          required: true
  - type: input
    id: app
    attributes:
      label: 应用或共享模块
      description: 填写应用 ID、目录名或 common 模块；跨应用问题可列出多个，不确定时可填写“不清楚”。
      placeholder: 例如：store、pixel-dungeon、common/cpp
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 涉及模块
      options:
        - 应用功能或游戏玩法
        - 界面、输入与适配
        - 性能、音频与资源
        - 存档、数据与设置
        - 商城客户端
        - 应用构建与 common 共享代码
        - 不确定或其他
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: 版本信息
      description: 优先填写已安装应用的版本与安装来源；源码构建时补充 pxa-apps 提交和 SDK 版本。无法确认的项目可填写“不清楚”。
      placeholder: |-
        已安装应用版本或应用包文件名：
        安装来源（商城、发行版链接或本地构建）：
        pxa-apps 提交（仅源码构建）：
        DevKit、SDK 版本或 pxa.lock 发行版本（仅源码构建）：
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 提供设备固件或模拟器版本、板型与屏幕显示配置；按问题补充输入方式、存储或网络。不适用的项目可填写“不适用”。
      placeholder: |-
        真机或模拟器、固件版本：
        板型、芯片、屏幕尺寸与显示配置：
        输入方式（触屏、按键或手柄）：
        存储介质、网络与资源版本（如相关）：
        主机系统（仅模拟器或源码构建）：
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 实际表现
      description: 描述具体错误及影响；一次反馈一个问题。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供完整命令、配置或最小示例；偶发问题请写明触发条件与频率。
      placeholder: |-
        1. 安装并打开指定版本的应用
        2. 描述页面、关卡、输入与必要资源
        3. 观察结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期表现
      description: 说明在相同步骤下期望发生什么。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 粘贴构建、串口、崩溃或模拟器日志，并保留错误前后的上下文；无需手写代码块。提交前移除私钥、令牌和个人信息。
      render: text
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 附件与补充信息
      description: 可拖入截图、录屏或最小复现文件；如已知，补充正常版本、回归范围、变通方法及相关 Issue 链接。
    validations:
      required: false
