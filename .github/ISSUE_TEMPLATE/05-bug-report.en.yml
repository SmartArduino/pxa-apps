name: English | Bug report
description: Report a bug, crash or unexpected behavior.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |-
        This repository covers: PXA apps, games, store client and shared application code.

        - [pxa-workspace](https://github.com/SmartArduino/pxa-workspace/issues/new?template=05-bug-report.en.yml): ESP firmware, board drivers, flashing, workspace scripts and display profiles.
        - [pxa-system](https://github.com/SmartArduino/pxa-system/issues/new?template=05-bug-report.en.yml): System runtime, services, UI, SDK, DevKit, Agent Kit, packaging tools and simulator implementation.

        If unsure, report what you observed and link related issues. Please avoid duplicate reports.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched [existing issues](https://github.com/SmartArduino/pxa-apps/issues?q=is%3Aissue) and
            found no duplicate.
          required: true
  - type: input
    id: app
    attributes:
      label: App or shared module
      description: Enter app IDs, directories or a common module; list multiple if needed, or use unknown if unsure.
      placeholder: e.g. store, pixel-dungeon, common/cpp
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - App behavior or gameplay
        - UI, input and display adaptation
        - Performance, audio and resources
        - Saves, data and settings
        - Store client
        - App builds and shared common code
        - Unsure or other
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Versions
      description: Include the installed app version and source; add the apps commit and SDK version for source
        builds; use unknown if unavailable.
      placeholder: |-
        Installed app version / package filename:
        Install source (store / release URL / local build):
        pxa-apps commit (source builds only):
        DevKit / SDK version or pxa.lock release (source builds only):
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include firmware or simulator version, board and display profile, with input, storage or network
        details when relevant; use N/A where appropriate.
      placeholder: |-
        Device or simulator / firmware version:
        Board / chip / display size / profile:
        Input method (touch / buttons / controller):
        Storage / network / resource version (if relevant):
        Host OS (simulator or source builds only):
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Actual behavior
      description: Describe the error and its impact; report one problem per issue.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include exact commands, configuration or a minimal example; describe triggers and frequency for
        intermittent issues.
      placeholder: |-
        1. Install and open the specified app version
        2. Describe the screen, level, input and required resources
        3. Observe the result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what should happen with the same steps.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs with surrounding context, without code fences; remove private keys, tokens
        and personal data.
      render: text
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Attachments and context
      description: Attach screenshots, recordings or a minimal reproducer; include known working versions, workarounds
        and related issues if available.
    validations:
      required: false
