name: 功能建议 / Feature request
description: 提出有明确场景的功能或改进建议 / Suggest a feature or improvement with a use case.
title: '[Feature] '
body:
  - type: markdown
    attributes:
      value: |-
        本仓库受理 / This repository covers: PXA 应用、游戏、商城客户端与 common 共享应用代码 / PXA apps, games, store client and shared application code。

        - [pxa-workspace](https://github.com/SmartArduino/pxa-workspace/issues/new/choose): ESP 固件、板级驱动、烧录、工作区脚本与显示配置 / ESP firmware, board drivers, flashing, workspace scripts and display profiles。
        - [pxa-system](https://github.com/SmartArduino/pxa-system/issues/new/choose): 系统运行库、服务、UI、SDK、DevKit、Agent Kit、打包工具与模拟器实现 / System runtime, services, UI, SDK, DevKit, Agent Kit, packaging tools and simulator implementation。

        不确定归属时，可按观察到的问题提交，并关联其他仓库中的相关 Issue；同一问题请勿重复提交。 / If unsure, report what you observed and link related issues; avoid duplicate reports.
        可使用中文或英文填写。 / Chinese or English is welcome.
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查 / Before submitting
      options:
        - label: 我已搜索[现有 Issue](https://github.com/SmartArduino/pxa-apps/issues?q=is%3Aissue)，未找到相同反馈。 / I searched existing
            issues and found no duplicate.
          required: true
  - type: input
    id: app
    attributes:
      label: 应用或共享模块 / App or shared module
      description: 填写应用 ID、目录名或 common 模块；跨应用问题可列出多个，不确定可写 unknown。 / Enter app IDs, directories or a common module;
        list multiple if needed, or use unknown if unsure.
      placeholder: 例如 / e.g. store, pixel-dungeon, common/cpp
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 涉及模块 / Component
      options:
        - 应用功能或游戏玩法 / App behavior or gameplay
        - 界面、输入与适配 / UI, input and display adaptation
        - 性能、音频与资源 / Performance, audio and resources
        - 存档、数据与设置 / Saves, data and settings
        - 商城客户端 / Store client
        - 应用构建与 common 共享代码 / App builds and shared common code
        - 不确定或其他 / Unsure or other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题 / Use case and problem
      description: 描述谁在什么场景遇到了什么限制，以及它的影响。 / Describe who encounters the limitation, when it occurs and its impact.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的改进 / Proposed improvement
      description: 说明期望的行为及如何判断需求已满足；无需预先确定实现方案。 / Describe the desired behavior and how to judge success; an implementation
        plan is optional.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方式 / Alternatives
      description: 说明现有做法、变通方法及其不足。 / Describe current approaches, workarounds and their limitations.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 相关环境与参考 / Environment and references
      description: 按需补充版本、板型或应用、兼容性要求、截图与相关 Issue。 / Add relevant versions, boards or apps, compatibility requirements, screenshots
        and related issues.
    validations:
      required: false
